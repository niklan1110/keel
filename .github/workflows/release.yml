name: Release

# Publishes ghcr.io/<owner>/keel, keel-functions and keel-postgres (keel-db:
# Postgres with pgvector and PostGIS) for amd64 and arm64, only after CI
# (ci.yml) has passed for the same commit:
#
#   - A version tag (git tag -a v0.2.0 -m "Keel 0.2.0" && git push origin v0.2.0)
#     publishes the tags 0.2.0, 0.2, 0 (from 1.0 on) and latest, then creates
#     the GitHub release: notes from CHANGELOG.md, and the installers (bash
#     and Windows PowerShell), the keel commands and the compose files, with
#     SHA-256 checksums. A tag with a suffix, such as
#     v0.3.0-rc.1, publishes only 0.3.0-rc.1 and a pre-release.
#   - A push to the default branch publishes `edge` (its branch name isn't a tag), never
#     `latest`.
#   - Run by hand from the Actions tab, it does the same for the chosen ref.
#
# Images are scanned (Trivy) before they are pushed, carry an SBOM and build
# provenance, and are signed with cosign (keyless, GitHub's OIDC identity).
#
# The website's address (used in the docs inside the image) comes from the run
# input, else the KEEL_SITE_URL repository variable, else .github/site-url.

on:
  push:
    tags: ['v*']
    branches: ['**']   # only the default branch is published (see prepare)
  workflow_dispatch:
    inputs:
      site_url:
        description: "The Keel website's address, e.g. https://keel.example.com (default: the KEEL_SITE_URL variable)"
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A newer push replaces an edge build; a version release always finishes.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  prepare:
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      site: ${{ steps.site.outputs.url }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          base=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$REF_NAME is not a version tag (v1.2.3 or v1.2.3-rc.1)"; exit 1
            fi
            version=${REF_NAME#v}
            if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::add a '## [$version] - YYYY-MM-DD' section before tagging"; exit 1
            fi
            if [ "$base" != "${version%%-*}" ]; then
              echo "::warning file=package.json::package.json says $base, the tag $version"
            fi
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
            { echo "tag=$REF_NAME"; echo "version=$version"; echo release=true; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          else
            version="$base-edge+${GITHUB_SHA::7}"
            { echo tag=; echo "version=$version"; echo release=false; echo prerelease=false; } >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $version"
      - id: site
        env:
          FROM_INPUT: ${{ inputs.site_url }}
          FROM_VARIABLE: ${{ vars.KEEL_SITE_URL }}
        run: |
          url="${FROM_INPUT:-$FROM_VARIABLE}"
          if [ -z "$url" ] && [ -f .github/site-url ]; then url=$(tr -d '[:space:]' < .github/site-url); fi
          if [ -n "$url" ] && ! [[ "$url" =~ ^https?://[A-Za-z0-9.:/-]+$ ]]; then
            echo "::error::the website address must look like https://keel.example.com"; exit 1
          fi
          echo "Website: ${url:-(not set)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      called: true

  image:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    strategy:
      matrix:
        include:
          - name: keel
            target: ''
            licenses: MIT
          - name: keel-functions
            target: functions
            licenses: MIT
          # Postgres, pgvector and PostGIS, under their own licenses.
          - name: keel-postgres
            target: db
            licenses: PostgreSQL AND GPL-2.0-or-later
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.release == 'true' && !startsWith(needs.prepare.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.release == 'true' && needs.prepare.outputs.prerelease == 'false' }}
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}

      # First an amd64 build for this machine, scanned before anything is pushed.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Scan for critical vulnerabilities with a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            KEEL_IMAGE_PREFIX=ghcr.io/${{ needs.prepare.outputs.owner }}
            KEEL_SITE_URL=${{ needs.prepare.outputs.site }}
            KEEL_BUILD_VERSION=${{ needs.prepare.outputs.version }}
            KEEL_BUILD_REVISION=${{ github.sha }}
            KEEL_SOURCE_REPO=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    needs: [prepare, image]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # attest the release files
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=website --include-workspace-root --ignore-scripts --no-audit --no-fund

      # The website build writes the downloadable files. For a release they
      # install this version and fetch the other files from the release itself.
      - name: Build the install files
        env:
          KEEL_DOCS_BASE: /
          KEEL_SITE_URL: ${{ needs.prepare.outputs.site }}
          KEEL_IMAGE_PREFIX: ghcr.io/${{ needs.prepare.outputs.owner }}
          KEEL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          KEEL_FILES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
        run: |
          npm run build -w website
          mkdir release
          for f in install.sh keel-cli.sh install.ps1 keel-cli.ps1 keel.cmd \
                   docker-compose.yml docker-compose.small.yml docker-compose.windows.yml keel.env.example \
                   zimaos-docker-compose.yml nas-docker-compose.yml cloudflare-tunnel.yml icon.svg; do
            cp "website/.vitepress/dist/$f" release/
          done
          cd release
          sha256sum -- * > SHA256SUMS
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          cat SHA256SUMS

      # GitHub stores attestations only for public repositories (or
      # organisation plans); a private personal repo still gets SHA256SUMS.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ needs.prepare.outputs.owner }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SERVER: ${{ github.server_url }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no notes for $VERSION in CHANGELOG.md"; exit 1; }
          cat >> notes.md <<EOF

          ## Install or update

          Images: \`ghcr.io/$OWNER/keel:$VERSION\`, \`ghcr.io/$OWNER/keel-functions:$VERSION\` and \`ghcr.io/$OWNER/keel-postgres:$VERSION\` (amd64 and arm64, signed with cosign).

          Download the installer for this version, check it, then run it:

          \`\`\`bash
          curl -fsSLO $SERVER/$REPO/releases/download/$TAG/install.sh
          curl -fsSLO $SERVER/$REPO/releases/download/$TAG/install.sh.sha256
          sha256sum -c install.sh.sha256      # macOS: shasum -a 256 -c install.sh.sha256
          sudo bash install.sh
          \`\`\`

          On Windows with Docker Desktop, in PowerShell:

          \`\`\`powershell
          Invoke-WebRequest $SERVER/$REPO/releases/download/$TAG/install.ps1 -OutFile install.ps1 -UseBasicParsing
          Invoke-WebRequest $SERVER/$REPO/releases/download/$TAG/install.ps1.sha256 -OutFile install.ps1.sha256 -UseBasicParsing
          if ((Get-FileHash install.ps1).Hash -eq (Get-Content install.ps1.sha256).Split(' ')[0]) {
            powershell -ExecutionPolicy Bypass -File .\install.ps1
          } else { 'install.ps1 does not match its checksum: do not run it' }
          \`\`\`

          The build attestations check the files independently: \`gh attestation verify install.ps1 --repo $REPO\`.

          Both installers check every file they download against \`SHA256SUMS\`.

          On an existing install, \`./keel update --version $VERSION\` in the install folder backs up every database first; \`./keel rollback\` goes back.

          SHA-256 of every file:

          \`\`\`
          $(cat release/SHA256SUMS)
          \`\`\`
          EOF

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$TAG" --verify-tag --title "Keel $VERSION" --notes-file notes.md "${flags[@]}" release/*
